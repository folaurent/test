<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automation Portal — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- "Prototype" banner for the developer -->
  <div id="proto-banner">
    <span>🧪 <strong>Interactive prototype</strong> — mock data, no backend. Visual spec for the developer.</span>

      <span>View as</span>
      <button data-role="client" class="active">Client</button>
      <button data-role="agency">Agency (admin)</button>
    </div>
  </div>

  <div id="app"><!-- rendered by app.js --></div>

  <script src="app.js"></script>
</body>
