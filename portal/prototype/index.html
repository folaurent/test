<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portail Automatisations — Maquette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Bandeau "maquette" pour le développeur -->
  <div id="proto-banner">
    <span>🧪 <strong>Maquette interactive</strong> — données fictives, aucun backend. Sert de spec visuelle pour le développeur.</span>
    <div class="role-switch">
      <span>Voir en tant que :</span>
      <button data-role="client" class="active">Client</button>
      <button data-role="agency">Agence (admin)</button>
    </div>
  </div>

  <div id="app"><!-- rendu par app.js --></div>

  <script src="app.js"></script>
</body>
</html>
