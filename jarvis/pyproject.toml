[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis v6 — écosystème d'IA auto-constructible piloté depuis Telegram"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "anthropic>=0.39",
  "aiogram>=3.10",
  "slack-bolt>=1.20",
  "slack-sdk>=3.27",
  "aiohttp>=3.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "supabase>=2.8",
  "redis>=5.0",
  "structlog>=24.1",
  "cryptography>=43.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "tenacity>=9.0",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
